<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alter Fire · Doechii Bridge</title>
<meta name="theme-color" content="#000000">
<style>
html,body{
  margin:0;padding:0;height:100%;width:100%;
  background:#000;overflow:hidden;cursor:pointer;
  color:#ffa400;font-family:system-ui,sans-serif;
}
#flame{position:absolute;top:0;left:0;width:100%;height:100%;}
#ignite{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:1.5rem;letter-spacing:0.08em;
  background:none;border:1px solid #ffa400;
  padding:0.8em 1.4em;border-radius:3px;color:#ffa400;
}
#mantra{
  display:none;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:1.2rem;text-align:center;
  text-transform:lowercase;opacity:0;
}
#selfcheck{
  display:none;position:absolute;bottom:1rem;right:1rem;
  font-size:0.8rem;color:#ffa400;opacity:0.7;
}
:focus-visible{outline:2px solid #ffa400;outline-offset:4px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="flame"></canvas>
<button id="ignite" aria-label="ignite">ignite</button>
<div id="mantra">burn clean · flip the frame</div>
<div id="selfcheck">sync ok · bridge live</div>

<script>
let ctx,audioCtx,osc1,osc2,osc3,gainNode,anim,startTime;
const canvas=document.getElementById('flame');
const c=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener('resize',resize);resize();

function drawFlame(t){
  const w=canvas.width,h=canvas.height;
  const time=(t-startTime)/1000;
  const p=(Math.sin(time*0.7)+1)/2;
  const grad=c.createRadialGradient(w/2,h*0.65,10,w/2,h*0.65,h*0.45);
  grad.addColorStop(0,`rgba(0,255,180,${0.6+0.3*p})`);
  grad.addColorStop(0.3,`rgba(255,160,0,${0.3+0.2*p})`);
  grad.addColorStop(1,`rgba(150,0,255,0)`);
  c.clearRect(0,0,w,h);
  c.fillStyle=grad;
  c.beginPath();
  const spread=40+20*Math.sin(time*7);
  c.ellipse(w/2,h*0.65,spread,200,0,0,Math.PI*2);
  c.fill();
  anim=requestAnimationFrame(drawFlame);
}

async function ignite(){
  if(audioCtx)return;
  document.getElementById('ignite').style.display='none';
  startTime=performance.now();
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  gainNode=audioCtx.createGain();gainNode.gain.value=0.001;

  osc1=audioCtx.createOscillator();osc1.type='sine';osc1.frequency.value=370;
  osc2=audioCtx.createOscillator();osc2.type='sine';osc2.frequency.value=262;
  osc3=audioCtx.createOscillator();osc3.type='sine';osc3.frequency.value=440;

  const trem=audioCtx.createOscillator();trem.frequency.value=7;
  const tremGain=audioCtx.createGain();tremGain.gain.value=0.05;
  trem.connect(tremGain).connect(gainNode.gain);

  osc1.connect(gainNode);osc2.connect(gainNode);osc3.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  osc1.start();osc2.start();osc3.start();trem.start();

  let vol=0.001;
  const fade=setInterval(()=>{
    vol+=0.005;
    if(vol>=0.15){vol=0.15;clearInterval(fade);}
    gainNode.gain.value=vol;
  },100);

  anim=requestAnimationFrame(drawFlame);

  // reveal mantra
  setTimeout(()=>{
    const m=document.getElementById('mantra');
    m.style.display='block';
    let o=0;const fadeIn=setInterval(()=>{o+=0.02;m.style.opacity=o;if(o>=1)clearInterval(fadeIn);},60);
  },15000);

  // reveal selfcheck
  setTimeout(()=>{
    const s=document.getElementById('selfcheck');
    s.style.display='block';
    s.style.opacity=0.7;
  },30000);

  // keep background play
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){audioCtx.resume();}
  });
}

document.getElementById('ignite').addEventListener('click',ignite);
document.body.addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='Enter')&&!audioCtx)ignite();
  if(e.code==='Escape'&&audioCtx){audioCtx.close();cancelAnimationFrame(anim);location.reload();}
});
</script>
</body>
</html>
