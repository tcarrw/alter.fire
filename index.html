<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alter Fire · Doechii Bridge v3.5</title>
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ffa400;font-family:system-ui,sans-serif;}
#letters,#flame{position:absolute;top:0;left:0;width:100%;height:100%;}
#aura{position:absolute;top:40%;left:50%;transform:translateX(-50%);font-size:1.1rem;text-align:center;
color:#ffa400;text-shadow:0 0 12px #9933ff;opacity:0;pointer-events:none;}
#mantra{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:1.2rem;text-align:center;text-transform:lowercase;color:#ffa400;}
#selfcheck{display:none;position:absolute;bottom:1rem;right:1rem;font-size:.8rem;opacity:.7;}
#ignite{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:1.3rem;letter-spacing:.08em;border:1px solid #ffa400;padding:.8em 1.4em;background:none;color:#ffa400;}
#playlist{position:absolute;bottom:0;width:100%;height:80px;border:none;}
#answerBtn{display:none;position:absolute;bottom:6rem;left:50%;transform:translateX(-50%);
background:none;border:1px solid #ffa400;color:#ffa400;padding:.5em 1em;}
#overlay{display:none;position:absolute;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.8);
color:#ffa400;padding:1rem;text-align:center;}
textarea{width:90%;height:60px;background:#111;color:#ffa400;border:1px solid #ffa400;}
button{background:none;border:1px solid #ffa400;color:#ffa400;padding:.4em .8em;margin-top:.6em;}
</style>
</head>
<body>
<canvas id="letters"></canvas>
<canvas id="flame"></canvas>
<div id="aura"></div>
<button id="ignite" aria-label="ignite">ignite</button>
<div id="mantra">burn clean · flip the frame</div>
<div id="selfcheck">sync ok · bridge live</div>
<button id="answerBtn">🔥 answer</button>
<div id="overlay">
  <p>Track response — what did you feel here?</p>
  <select id="trackSel">
    <option>Crazy</option><option>What It Is</option>
    <option>Yucky Blucky Fruitcake</option><option>Pacer</option><option>Booty Drop</option>
  </select><br>
  <textarea id="answer"></textarea><br>
  <button id="sendBtn">Send</button>
</div>
<iframe id="playlist" allow="autoplay *; encrypted-media *;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
src="https://embed.music.apple.com/us/playlist/doechii-bridge-demo/pl.u-XXXX"></iframe>

<script>
// ----- data -----
const lyricAura={
 "Crazy":["energy shifts / flame cracks open","laugh till the bridge shakes"],
 "What It Is":["truth walks heavy / beat still sweet"],
 "Yucky Blucky Fruitcake":["born loud / still rising","childhood glitter / grit mix"],
 "Pacer":["step / slide / spark / repeat"],
 "Booty Drop":["swarm joy / bass honey / air flips"]
};

// ----- setup -----
const canvas=document.getElementById('flame'),c=canvas.getContext('2d');
const letterCanvas=document.getElementById('letters'),lc=letterCanvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;
letterCanvas.width=innerWidth;letterCanvas.height=innerHeight;}
addEventListener('resize',resize);resize();

let audioCtx,gainNode,osc,tiltX=0,tiltY=0,auraIdx=0,activeTrack="Crazy";
let startTime,auraDiv=document.getElementById('aura');

// ----- letters -----
const letters="DOECHII".split('');
function drawLetters(t){
 lc.clearRect(0,0,letterCanvas.width,letterCanvas.height);
 lc.fillStyle="rgba(255,164,0,0.05)";
 for(let y=0;y<letterCanvas.height;y+=60){
  for(let x=0;x<letterCanvas.width;x+=40){
   const ch=letters[Math.floor(Math.random()*letters.length)];
   lc.fillText(ch,x+5*Math.sin(t/1000+y),y);
  }
 }
}

// ----- flame -----
function drawFlame(t){
 const w=canvas.width,h=canvas.height;
 const time=(t-startTime)/1000;
 const p=(Math.sin(time*0.7)+1)/2;
 const grad=c.createRadialGradient(w/2+tiltX,h*0.65+tiltY,10,w/2,h*0.65,h*0.45);
 grad.addColorStop(0,`rgba(0,255,180,${0.6+0.3*p})`);
 grad.addColorStop(0.3,`rgba(255,160,0,${0.3+0.2*p})`);
 grad.addColorStop(1,`rgba(150,0,255,0)`);
 c.clearRect(0,0,w,h);
 c.fillStyle=grad;
 c.beginPath();
 c.ellipse(w/2+tiltX,h*0.65+tiltY,40+20*Math.sin(time*7),200,0,0,Math.PI*2);
 c.fill();
 requestAnimationFrame(drawFlame);
 drawLetters(t);
}

// ----- audio -----
function startAudio(){
 audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 osc=audioCtx.createOscillator();osc.frequency.value=370;osc.type='sine';
 gainNode=audioCtx.createGain();gainNode.gain.value=0.001;
 osc.connect(gainNode).connect(audioCtx.destination);osc.start();
 let vol=0.001;
 const fade=setInterval(()=>{vol+=0.005;if(vol>=0.15){vol=0.15;clearInterval(fade);}gainNode.gain.value=vol;},100);
}

// ----- aura -----
function showAura(){
 const lines=lyricAura[activeTrack]||["the bridge hums"];
 auraDiv.textContent=lines[auraIdx%lines.length];
 auraIdx++;
 auraDiv.style.opacity=1;
 setTimeout(()=>auraDiv.style.opacity=0,5000);
}
setInterval(showAura,42000);

// tap flame to advance
canvas.addEventListener('click',showAura);

// ----- parallax tilt -----
window.addEventListener('deviceorientation',e=>{
 tiltX=(e.gamma||0)/3;tiltY=(e.beta||0)/6;
});

// random drift every 42s
setInterval(()=>{tiltX=(Math.random()-0.5)*6;tiltY=(Math.random()-0.5)*6;},42000);

// ----- controls -----
document.getElementById('ignite').onclick=()=>{
 startAudio();startTime=performance.now();drawFlame(startTime);
 document.getElementById('ignite').remove();
 setTimeout(()=>document.getElementById('mantra').style.display='block',15000);
 setTimeout(()=>{
  document.getElementById('selfcheck').style.display='block';
  document.getElementById('answerBtn').style.display='block';
 },30000);
};

// answer overlay
const ansBtn=document.getElementById('answerBtn'),overlay=document.getElementById('overlay');
ansBtn.onclick=()=>overlay.style.display='block';
document.getElementById('sendBtn').onclick=()=>{
 const ans=document.getElementById('answer').value.trim();
 const tr=document.getElementById('trackSel').value;
 if(!ans)return;
 let saved=JSON.parse(localStorage.getItem('bridgeAnswers')||"[]");
 saved.push({track:tr,text:ans,time:Date.now()});
 localStorage.setItem('bridgeAnswers',JSON.stringify(saved));
 overlay.style.display='none';document.getElementById('answer').value='';
 auraDiv.textContent=ans;auraDiv.style.opacity=1;setTimeout(()=>auraDiv.style.opacity=0,6000);
};
</script>
</body>
</html>
